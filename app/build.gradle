plugins {
    id 'com.android.application'
    id 'com.diffplug.spotless'
}

android {
    namespace 'app.zipper.knot'
    compileSdk 37

    defaultConfig {
        applicationId 'app.zipper.knot'
        minSdk 26
        targetSdk 35
        versionCode 17
        versionName "2.8.0"
        multiDexEnabled true
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    lint {
        checkReleaseBuilds false
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    androidResources {
        additionalParameters '--allow-reserved-package-id', '--package-id', '0x64'
        noCompress 'themefile'
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java']
        }
    }

    packaging {
        resources {
            merges += 'META-INF/xposed/*'
        }
    }
}

spotless {
    java {
        target 'src/*/java/**/*.java'
        toggleOffOn('@formatter:off', '@formatter:on')
        googleJavaFormat('1.25.0').reflowLongStrings(false)
        importOrder()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
    compileOnly 'androidx.appcompat:appcompat:1.7.0'
    compileOnly 'androidx.fragment:fragment:1.8.6'
    compileOnly 'androidx.constraintlayout:constraintlayout:2.2.1'
    compileOnly 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
}
